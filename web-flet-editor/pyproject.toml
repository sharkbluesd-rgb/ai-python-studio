[project]
name = "ai-python-studio-web-editor"
version = "0.1.0"
description = "Isolated Flet CodeEditor browser compatibility smoke test"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-code-editor==1.1.2",
]

[tool.flet]
product = "AI Python Studio Web Editor"
org = "com.aipythonstudio"

[tool.flet.app]
path = "src"

[tool.flet.web]
base_url = "/ai-python-studio/flet-editor/"
route_url_strategy = "hash"
renderer = "canvaskit"
cdn = false
wasm = false
