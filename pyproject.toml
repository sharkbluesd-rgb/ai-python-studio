[project]
name = "ai-python-studio"
version = "0.2.0"
description = "Persistent mobile Python development workspace built with Flet"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0,<2.0",
]

[tool.flet]
product = "AI Python Studio"
org = "com.aipythonstudio"

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = ["arm64-v8a"]
