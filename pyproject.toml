[project]
name = "flet-apk-studio"
version = "2.0.0"
description = "Mobile-first builder for Python Flet Android APKs"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
]

[tool.flet]
product = "Flet APK Studio"
org = "com.aipythonstudio"

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = ["arm64-v8a"]

[dependency-groups]
dev = ["flet-cli==1.1.2"]

[tool.flet.boot_screen]
name = "flet"
[tool.flet.boot_screen.flet]
theme_mode = "dark"
bgcolor_dark = "#080D16"
spinner_color_dark = "#8175F5"
spinner_size = 34
text_color_dark = "#F2F4FC"
prepare_message = "جارٍ تجهيز Flet APK Studio..."
startup_message = "جارٍ تجهيز أداة بناء تطبيقات Android..."
fade_out_duration = 250
