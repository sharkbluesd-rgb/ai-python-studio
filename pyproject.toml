[project]
name = "ai-python-studio"
version = "1.1.0"
description = "Mobile Python development workspace with project tools and code editor"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-code-editor==1.1.2",
]

[tool.flet]
product = "AI Python Studio"
org = "com.aipythonstudio"

[tool.flet.app]
path = "src"

[tool.flet.android]
target_arch = ["arm64-v8a"]
