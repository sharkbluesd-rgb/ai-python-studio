name: Build Flet APK Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install code quality and security tools
        run: python -m pip install --upgrade ruff bandit pip-audit

      - name: Lint Python sources
        run: ruff check src tests --select E4,E7,E9,F

      - name: Security scan
        run: bandit -q -r src -lll

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-version: "2.0.0"
          build-number: ${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: flet-apk
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          retention-days: 14
