name: Build AI Python Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python for tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@74d5761ff4f3a249cad826697ac8b36b025f7052
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload APK archive
        uses: actions/upload-artifact@v7
        with:
          name: ai-python-studio-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
