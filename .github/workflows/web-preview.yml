name: Build and deploy AI Python Studio Web Preview

on:
  push:
    branches:
      - feature/studio-2.0
    paths:
      - "src/web_preview.py"
      - "src/skills_manager.py"
      - "src/agent_skills/**"
      - "tools/build_web_skills.py"
      - "tests/test_web_preview.py"
      - "pyproject.toml"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

concurrency:
  group: pages-preview
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLET_CLI_NO_RICH_OUTPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build browser preview with bundled CodeEditor extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Flet and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "flet-cli==1.1.2"

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run browser preview tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_web_preview.py" -v

      - name: Prepare isolated Flet app with CodeEditor dependency
        run: |
          mkdir -p web-preview
          cp src/web_preview.py web-preview/main.py
          PYTHONPATH=src python tools/build_web_skills.py --output web-preview/web_skill_catalog.py
          cat > web-preview/pyproject.toml <<'EOF'
          [project]
          name = "ai-python-studio-web-preview"
          version = "1.2.0"
          requires-python = ">=3.10"
          dependencies = [
              "flet==1.1.2",
              "flet-code-editor==1.1.2",
          ]

          [tool.flet]
          product = "AI Python Studio Web Preview"
          EOF

      - name: Build static web app with custom Flutter extensions
        run: >-
          flet build web web-preview
          --yes
          --verbose
          --base-url "/ai-python-studio/"
          --route-url-strategy hash
          --no-cdn
          --output "${GITHUB_WORKSPACE}/build/web"

      - name: Verify web build and bundled CodeEditor dependency
        run: |
          test -s "${GITHUB_WORKSPACE}/build/web/index.html"
          test -d "${GITHUB_WORKSPACE}/build/web"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("build/web/assets/app/app.zip")
          if not archive.is_file():
              raise SystemExit("Flet app archive is missing.")
          with zipfile.ZipFile(archive) as app:
              names = app.namelist()
          matches = [name for name in names if "flet_code_editor" in name.lower()]
          if not matches:
              raise SystemExit("flet-code-editor was not bundled in the web app.")
          print(f"Bundled flet-code-editor entries: {len(matches)}")
          skill_modules = [name for name in names if "web_skill_catalog" in name.lower()]
          if not skill_modules:
              raise SystemExit("Web skill catalog was not bundled in the app archive.")
          skill_module = next(name for name in names if name.endswith("web_skill_catalog.py"))
          with app.open(skill_module) as source:
              catalog_source = source.read().decode("utf-8")
          if catalog_source.count("'name':") < 20 and catalog_source.count('"name":') < 20:
              raise SystemExit("The web skill catalog does not include all 20 skills.")
          print("Bundled 20 specialist skill references.")
          PY
          echo "Web build output and CodeEditor Python package verified."
          find "${GITHUB_WORKSPACE}/build/web" -maxdepth 2 -type f | head -40

      - name: Upload standalone browser preview
        uses: actions/upload-artifact@v7
        with:
          name: ai-python-studio-web-preview
          path: ${{ github.workspace }}/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/build/web
          name: github-pages

      - name: Summarize browser preview
        if: always()
        run: |
          {
            echo "## AI Python Studio — Browser Preview"
            echo "- Static web build: passed."
            echo "- GitHub Pages deployment artifact uploaded."
            echo "- [Open workflow artifacts](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish browser preview
    if: github.ref == 'refs/heads/feature/studio-2.0'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
