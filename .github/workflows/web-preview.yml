name: Build and deploy Flet APK Studio Web Preview

on:
  push:
    branches:
      - feature/studio-2.0
    paths:
      - "src/web_api.py"
      - "src/flet_project.py"
      - "src/github_cloud.py"
      - "src/workspace.py"
      - "src/templates.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "render.yaml"
      - "tools/build_static_web_preview.py"
      - "web-preview-static/**"
      - "tests/**"
      - "WEB_ARCHITECTURE.md"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

concurrency:
  group: pages-flet-apk-studio
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test web API and prepare static assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install web service and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip install ruff bandit pip-audit
      - name: Compile source
        run: python -m compileall -q src tests tools
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Lint and audit
        run: |
          ruff check src tests --select E4,E7,E9,F
          bandit -q -r src -lll
          pip-audit -r requirements.txt
      - name: Verify web assets
        run: |
          python tools/build_static_web_preview.py --output build/web
          test -s build/web/index.html
          test -s build/web/style.css
          test -s build/web/app.js
          python - <<'PY'
          from pathlib import Path
          html = Path("build/web/index.html").read_text(encoding="utf-8")
          script = Path("build/web/app.js").read_text(encoding="utf-8")
          assert "Flet APK Studio" in html
          assert "/api/build/start" in script
          assert "/api/build/download" in script
          print("Verified the web frontend is wired to the FastAPI routes.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: flet-apk-studio-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
