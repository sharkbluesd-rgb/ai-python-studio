name: Build and deploy Flet APK Studio Web Preview

on:
  push:
    branches:
      - feature/studio-2.0
    paths:
      - "src/main.py"
      - "src/flet_project.py"
      - "src/github_cloud.py"
      - "src/workspace.py"
      - "src/templates.py"
      - "tools/build_static_web_preview.py"
      - "web-preview-static/**"
      - "tests/test_app_startup.py"
      - "tests/test_builder_preview.py"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

concurrency:
  group: pages-flet-apk-studio
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test builder and prepare browser preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff bandit pip-audit

      - name: Compile Python source
        run: python -m compileall -q src tests tools

      - name: Run unit and startup tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run static and security checks
        run: |
          ruff check src tests --select E4,E7,E9,F
          bandit -q -r src -lll
          pip-audit -r requirements.txt

      - name: Build standalone APK builder preview
        run: python tools/build_static_web_preview.py --output build/web

      - name: Verify static preview
        run: |
          test -s build/web/index.html
          test -s build/web/style.css
          test -s build/web/app.js
          python - <<'PY'
          from pathlib import Path
          root = Path("build/web")
          html = (root / "index.html").read_text(encoding="utf-8")
          script = (root / "app.js").read_text(encoding="utf-8")
          assert "Flet APK Studio" in html
          assert "رفع المشروع وبدء بناء APK" in html
          assert "CodeEditor" not in html + script
          assert 'id="source-editor"' not in html
          print("Verified responsive Flet APK builder preview.")
          PY

      - name: Upload browser preview
        uses: actions/upload-artifact@v7
        with:
          name: flet-apk-studio-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
          name: github-pages

  deploy:
    name: Publish browser preview
    needs: build
    if: github.ref == 'refs/heads/feature/studio-2.0'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Report deployment
        if: always()
        run: echo 'Check build and deploy job results before sharing the preview URL.' >> $GITHUB_STEP_SUMMARY
