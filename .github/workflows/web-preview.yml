name: Build and deploy AI Python Studio Web Preview

on:
  push:
    branches:
      - feature/studio-2.0
    paths:
      - "src/web_preview.py"
      - "tests/test_web_preview.py"
      - "pyproject.toml"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

concurrency:
  group: pages-preview-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLET_CLI_NO_RICH_OUTPUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build browser preview with bundled CodeEditor extension
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.configure_pages.outcome == 'success' }}
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Flet and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "flet-cli==1.1.2"

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run browser preview tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_web_preview.py" -v

      - name: Prepare isolated Flet app with CodeEditor dependency
        run: |
          mkdir -p web-preview
          cp src/web_preview.py web-preview/main.py
          cat > web-preview/pyproject.toml <<'EOF'
          [project]
          name = "ai-python-studio-web-preview"
          version = "1.2.0"
          requires-python = ">=3.10"
          dependencies = [
              "flet==1.1.2",
              "flet-code-editor==1.1.2",
          ]

          [tool.flet]
          product = "AI Python Studio Web Preview"
          EOF

      - name: Build static web app with custom Flutter extensions
        run: >-
          flet build web web-preview
          --yes
          --verbose
          --base-url "/ai-python-studio/"
          --route-url-strategy hash
          --output "${GITHUB_WORKSPACE}/build/web"

      - name: Verify web build and bundled CodeEditor dependency
        run: |
          test -s "${GITHUB_WORKSPACE}/build/web/index.html"
          test -d "${GITHUB_WORKSPACE}/build/web"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("build/web/assets/app/app.zip")
          if not archive.is_file():
              raise SystemExit("Flet app archive is missing.")
          with zipfile.ZipFile(archive) as app:
              names = app.namelist()
          matches = [name for name in names if "flet_code_editor" in name.lower()]
          if not matches:
              raise SystemExit("flet-code-editor was not bundled in the web app.")
          print(f"Bundled flet-code-editor entries: {len(matches)}")
          PY
          echo "Web build output and CodeEditor Python package verified."
          find "${GITHUB_WORKSPACE}/build/web" -maxdepth 2 -type f | head -40

      - name: Upload standalone browser preview
        uses: actions/upload-artifact@v7
        with:
          name: ai-python-studio-web-preview
          path: ${{ github.workspace }}/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain Pages setup requirement
        if: steps.configure_pages.outcome != 'success'
        run: |
          echo "::warning::The web preview artifact was uploaded, but Pages is not enabled by this GitHub connection."
          echo "Repository owner: enable Settings > Pages > Build and deployment > Source: GitHub Actions, then rerun this workflow."

      - name: Upload Pages deployment artifact
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/build/web
          name: github-pages

  deploy:
    name: Publish browser preview
    if: github.ref == 'refs/heads/feature/studio-2.0' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
