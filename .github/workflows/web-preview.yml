name: Build and deploy AI Python Studio Web Preview

on:
  push:
    branches:
      - feature/studio-2.0
    paths:
      - "src/web_preview.py"
      - "src/skills_manager.py"
      - "src/agent_skills/**"
      - "tools/build_static_web_preview.py"
      - "web-preview-static/**"
      - "web-flet-editor/**"
      - "tests/test_web_preview.py"
      - "pyproject.toml"
      - ".github/workflows/web-preview.yml"
  workflow_dispatch:

concurrency:
  group: pages-preview-static
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build standalone mobile browser preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install flet-cli==1.1.2
      - name: Compile Python source
        run: python -m compileall -q src tests tools
      - name: Run browser preview and startup tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_web_preview.py" -v
      - name: Build standalone static preview
        env:
          PYTHONPATH: src
        run: python tools/build_static_web_preview.py --output build/web
      - name: Build isolated Flet CodeEditor web app
        run: |
          flet build web web-flet-editor \
            --base-url /ai-python-studio/flet-editor/ \
            --route-url-strategy hash \
            --output build/web/flet-editor \
            --yes
      - name: Verify static output and skill catalog
        run: |
          test -s build/web/index.html
          test -s build/web/style.css
          test -s build/web/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/web')
          skills = json.loads((root / 'skills.json').read_text(encoding='utf-8'))
          assert len(skills) >= 20, f'Only {len(skills)} skills bundled'
          html = (root / 'index.html').read_text(encoding='utf-8')
          assert 'href="./style.css"' in html and 'src="./app.js"' in html
          assert 'href="./flet-editor/"' in html
          flet_root = root / 'flet-editor'
          assert (flet_root / 'index.html').is_file(), 'Flet CodeEditor build is missing index.html'
          assert any(p.suffix in {'.js', '.wasm'} for p in flet_root.rglob('*') if p.is_file()), 'Flet runtime assets are missing'
          assert not any(p.suffix in {'.wasm', '.mjs'} for p in root.iterdir() if p.is_file())
          print(f'Verified static UI ({len(skills)} skills) and isolated Flet CodeEditor web build.')
          PY
          du -sh build/web
      - name: Upload standalone browser preview
        uses: actions/upload-artifact@v7
        with:
          name: ai-python-studio-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
          name: github-pages
  deploy:
    name: Publish browser preview
    needs: build
    if: github.ref == 'refs/heads/feature/studio-2.0'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy standalone preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
      - name: Report deployment
        if: always()
        run: echo 'Inspect build and deploy job results before sharing the preview URL.' >> $GITHUB_STEP_SUMMARY
